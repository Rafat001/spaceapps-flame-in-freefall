# docker compose up --build                      -> api (:8000) + web (:3000), offline hash embeddings, no LLM needed
# docker compose --profile ollama up --build     -> also starts Ollama (:11434); then: docker compose exec ollama ollama pull llama3.2
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, args: { LOCAL_AI: "${LOCAL_AI:-0}", AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-hash}" } }
    env_file: [{ path: .env, required: false }]
    environment:
      AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-hash}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports: ["8000:8000"]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes:
  ollama: {}
